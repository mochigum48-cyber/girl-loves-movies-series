<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GL Admin</title><link rel="stylesheet" href="/style.css"><style>.wrap{max-width:650px;margin:auto;padding:20px}.box{background:white;border:1px solid var(--line);padding:17px;border-radius:16px;margin:15px 0}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{background:var(--deep);color:white;border:0;border-radius:18px;padding:11px 16px}.item{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}button{cursor:pointer}</style></head><body><div class="wrap"><h1>Admin Panel</h1><div class="box" id="login"><h2>Admin Login</h2><div class="field"><label>Username</label><input id="user" value="admin"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button class="btn" onclick="login()">Login</button><p id="msg"></p></div><div id="panel" hidden><div class="box"><h2>Series editor</h2><input type="hidden" id="sid"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Myanmar title</label><input id="mm"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Poster URL</label><input id="poster" placeholder="https://..."></div><div class="field"><label>Upload from Gallery</label><input id="file" type="file" accept="image/*"><button class="btn" onclick="upload()">Upload</button><small id="upmsg"></small></div><div class="field"><label>Banner URL</label><input id="banner"></div><div class="field"><label>Genre</label><input id="genre" value="GL Series"></div><div class="field"><label>Status</label><select id="status"><option>Ongoing</option><option>Completed</option><option>Coming Soon</option></select></div><label><input type="checkbox" id="featured"> Featured</label><p><button class="btn" onclick="save()">Save Series</button></p></div><div class="box"><h2>Series list</h2><div id="list"></div></div></div></div><script>
let token="";const $=x=>document.getElementById(x);async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})}),d=await r.json();if(!r.ok){$("msg").textContent=d.error;return}token=d.token;$("login").hidden=true;$("panel").hidden=false;load()}
const headers=()=>({"Content-Type":"application/json","Authorization":"Bearer "+token});function body(){return {title:$("title").value,titleMm:$("mm").value,description:$("desc").value,poster:$("poster").value,banner:$("banner").value,genre:$("genre").value,status:$("status").value,featured:$("featured").checked}}
async function save(){let id=$("sid").value,r=await fetch(id?"/api/admin/series/"+id:"/api/admin/series",{method:id?"PUT":"POST",headers:headers(),body:JSON.stringify(body())}),d=await r.json();if(!r.ok)return alert(d.error);alert("Saved");clear();load()}
async function upload(){let f=$("file").files[0];if(!f)return alert("Choose an image");let fd=new FormData();fd.append("image",f);let r=await fetch("/api/admin/upload",{method:"POST",headers:{"Authorization":"Bearer "+token},body:fd}),d=await r.json();if(r.ok){$("poster").value=d.url;$("upmsg").textContent="Uploaded ♡"}else $("upmsg").textContent=d.error}
async function load(){let r=await fetch("/api/series"),a=await r.json();$("list").innerHTML=a.map(x=>`<div class="item"><b>${x.title}</b><p><button onclick="edit('${x._id}')">Edit</button> <button onclick="del('${x._id}')">Delete</button></p></div>`).join("")||"No series"}
async function edit(id){let r=await fetch("/api/series/"+id),x=await r.json();$("sid").value=x._id;$("title").value=x.title||"";$("mm").value=x.titleMm||"";$("desc").value=x.description||"";$("poster").value=x.poster||"";$("banner").value=x.banner||"";$("genre").value=x.genre||"";$("status").value=x.status||"Ongoing";$("featured").checked=!!x.featured;window.scrollTo(0,0)}
async function del(id){if(confirm("Delete series?")){await fetch("/api/admin/series/"+id,{method:"DELETE",headers:headers()});load()}}
function clear(){["sid","title","mm","desc","poster","banner"].forEach(x=>$(x).value="");$("genre").value="GL Series";$("featured").checked=false}
</script></body></html>
